[workspace]
members = [
  "crates/hyperbox-core",
  "crates/hyperbox-network",
  "crates/hyperbox-agent",
  "crates/hyperbox-firecracker",
  "crates/hyperbox-apple",
  "crates/hyperbox-server",
  "crates/hyperbox-cli", "crates/hyperbox-proto",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["hyperbox contributors"]
repository = "https://example.invalid/hyperbox"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
camino = "1.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.12"
indexmap = { version = "2.12", features = ["serde"] }
