syntax = "proto3";

package hyperbox.v1;

message SandboxConfig {
  string template = 1;
  uint32 memory_mb = 2;
  uint32 vcpu_count = 3;
  uint64 timeout_secs = 4;
  map<string, string> env = 5;
  NetworkMode network_mode = 6;
  repeated string network_allowlist = 7;
}

message SandboxId {
  string value = 1;
}

message SandboxInfo {
  string id = 1;
  string template = 2;
  string state = 3;
  string created_at = 4;
}

message ExecRequest {
  string sandbox_id = 1;
  repeated string command = 2;
  uint64 timeout_secs = 3;
}

message ExecResponse {
  int32 exit_code = 1;
  string stdout = 2;
  string stderr = 3;
  uint64 duration_ms = 4;
}

message CreateSandboxRequest {
  SandboxConfig config = 1;
}

message CreateSandboxResponse {
  SandboxInfo info = 1;
}

message DestroySandboxRequest {
  string sandbox_id = 1;
}

message DestroySandboxResponse {}

message InspectSandboxRequest {
  string sandbox_id = 1;
}

message InspectSandboxResponse {
  SandboxInfo info = 1;
}

message ReadFileRequest {
  string sandbox_id = 1;
  string path = 2;
}

message ReadFileResponse {
  bytes bytes = 1;
}

message WriteFileRequest {
  string sandbox_id = 1;
  string path = 2;
  bytes bytes = 3;
}

message WriteFileResponse {}

message ListTemplatesRequest {}

message ListTemplatesResponse {
  repeated string templates = 1;
}

message MetricsRequest {}

message MetricsResponse {
  uint64 creates = 1;
  uint64 destroys = 2;
  uint64 execs = 3;
  uint64 exec_failures = 4;
  uint64 p50_exec_ms = 5;
  uint64 p95_exec_ms = 6;
}

message CreateSnapshotRequest {
  string sandbox_id = 1;
  string template = 2;
  string note = 3;
}

message CreateSnapshotResponse {
  string snapshot_id = 1;
  string created_at = 2;
}

message RestoreSnapshotRequest {
  string snapshot_id = 1;
}

message RestoreSnapshotResponse {
  SandboxInfo info = 1;
}

enum NetworkMode {
  NETWORK_MODE_UNSPECIFIED = 0;
  NETWORK_MODE_NONE = 1;
  NETWORK_MODE_ALLOWLIST = 2;
  NETWORK_MODE_FULL = 3;
}

service HyperboxControl {
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  rpc DestroySandbox(DestroySandboxRequest) returns (DestroySandboxResponse);
  rpc InspectSandbox(InspectSandboxRequest) returns (InspectSandboxResponse);
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);
  rpc GetMetrics(MetricsRequest) returns (MetricsResponse);
  rpc CreateSnapshot(CreateSnapshotRequest) returns (CreateSnapshotResponse);
  rpc RestoreSnapshot(RestoreSnapshotRequest) returns (RestoreSnapshotResponse);
}

service HyperboxAgent {
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
}
