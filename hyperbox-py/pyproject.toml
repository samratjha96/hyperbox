[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperbox"
version = "0.1.0"
description = "Python SDK for hyperbox sandbox runtime"
requires-python = ">=3.9"
dependencies = [
  "grpcio>=1.78.0",
  "protobuf>=6.31.1,<7",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["hyperbox*"]
